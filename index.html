<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mocau</title>

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #f4f6f9 100%);
      min-height: 100vh;
    }

    /* Container com proporção de App Mobile */
    .intro-card {
      width: 100%;
      max-width: 420px;
      border: none;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      background-color: #ffffff;
    }

    .logo-img {
      max-width: 150px;
      height: auto;
      object-fit: contain;
    }

    /* Botões personalizados */
    .btn-custom {
      border-radius: 12px;
      padding: 12px 20px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease-in-out;
    }

    .btn-custom:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

  <div class="card intro-card p-4 p-sm-5 text-center">
    
    <!-- ÁREA DE LOGO E MENSAGEM -->
    <div class="mb-4">
      <img src="/img/logo_MOCAL.png" alt="Logo MOCAU" class="logo-img mb-4 img-fluid">
      
      <h1 class="h4 fw-bold text-dark mb-2">Boas-vindas!</h1>
      <p class="text-muted small mb-0">Faça login ou crie uma conta para começar a usar o aplicativo.</p>
    </div>

    <!-- BOTÕES DE AÇÃO -->
    <div class="d-grid gap-3">
      <a href="login.html" class="btn btn-primary btn-custom d-flex align-items-center justify-content-center gap-2 shadow-sm">
        <i class="bi bi-box-arrow-in-right fs-5"></i>
        <span>Login</span>
      </a>
      
      <a href="cadastro.html" class="btn btn-outline-primary btn-custom d-flex align-items-center justify-content-center gap-2">
        <i class="bi bi-person-plus fs-5"></i>
        <span>Cadastrar</span>
      </a>
    </div>

  </div>

  <!-- Bootstrap 5 JavaScript Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
