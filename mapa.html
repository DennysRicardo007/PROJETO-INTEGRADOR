<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mapa de ocorrências de água">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/mapa.css">
    <link rel="stylesheet" href="css/home.css">
    <title>Mapa</title>
</head>

<body>
    <main class="app">
        <div class="menu-lateral">
            <button class="menu-fechar" onclick="fecharMenu()">&#10005;</button>

            <ul class="menu-lista">
                <li>Perfil</li>
                <li>Suporte</li>
                <li>Sair</li>
            </ul>
            <hr class="divisor">
        </div>

        <div class="overlay" onclick="fecharMenu()"></div>

        <header class="cabecalho">
            <a href="#" class="botao-voltar" onclick="window.location.href='home.html'">←</a>
            <h1>MAPA</h1>
            <img src="img/avatar-usuario.png" alt="Foto do perfil" class="foto-perfil">
        </header>

        <section class="comunidade">
            <div class="comunidade-info">
                <h2>Sua Comunidade:</h2>
                <p>Rua Agupé - Alto Santa Terezinha, 131</p>
            </div>
            <img src="img/mapa.png" alt="Ilustração da comunidade">
        </section>

        <div id="map"></div>
        <script src="js/maps.js" defer></script>
        <script>
            fetch('/api/maps-key')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Não foi possível obter a chave do mapa');
                    }
                    return response.json();
                })
                .then(data => {
                    if (!data.key) {
                        throw new Error('Chave do Google Maps não configurada');
                    }

                    const script = document.createElement('script');
                    script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(data.key)}&callback=initMap&loading=async`;
                    script.async = true;
                    script.defer = true;
                    document.head.appendChild(script);
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById('map').textContent = 'Não foi possível carregar o mapa.';
                });
        </script>

        <section class="legenda">
            <div class="btn-vazamento-agua">
                <span class="icone vazamento-icone"><img src="/img/icone-vazamento.png" alt="Vazamento"></span>
                <span>Vazamento de Água</span>
            </div>
            <div class="legenda-falta-agua">
                <span class="icone falta-icone"><img src="/img/icone-falta-agua.png" alt="Falta de Água"></span>
                <span>Falta de Água</span>
            </div>
        </section>

        <nav class="navegacao">
            <a href="mapa.html" class="navegacao-item ativo">
                <span><img src="/img/mapa_icon.png" alt="Mapa"></span>
                <p>Mapa</p>
            </a>

            <a href="registrar.html" class="navegacao-item">
                <span><img src="/img/registro_icon.png" alt="Registrar"></span>
                <p>Registrar</p>
            </a>
            <a href="./home.html" class="navegacao-item">
                <span>⌂</span>
                <p>Início</p>
            </a>
            <a href="historico.html" class="navegacao-item">
                <span><img src="/img/historico_icon.png" alt="Histórico"></span>
                <p>Histórico</p>
            </a>
            <a href="comunidade.html" class="navegacao-item">
                <span><img src="/img/comunidade_icon.png" alt="Comunidade"></span>
                <p>Comunidade</p>
            </a>
        </nav>
        <script src="js/home.js"></script>
    </main>
</body>
</html>
