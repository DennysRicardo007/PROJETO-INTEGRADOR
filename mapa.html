<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mapa de ocorrências de água">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/mapa.css">
    <title>Mapa</title>
</head>

<body>
    <main class="app">
        <div class="menu-lateral">
            <button class="menu-fechar" onclick="fecharMenu()">&#10005;</button>

            <ul class="menu-lista">
                <li>Perfil</li>
                <li>Suporte</li>
                <li>Sair</li>
            </ul>
            <hr class="divisor">
        </div>

        <div class="overlay" onclick="fecharMenu()"></div>

        <header class="cabecalho">
            <a href="#" class="botao-voltar" onclick="window.location.href='home.html'">←</a>
            <h1>MAPA</h1>
            <img src="img/avatar-usuario.png" alt="Foto do perfil" class="foto-perfil">
        </header>

        <section class="comunidade">
            <div class="comunidade-info">
                <h2>Sua Comunidade:</h2>
                <p>Rua Agupé - Alto Santa Terezinha, 131</p>
            </div>
            <img src="img/mapa.png" alt="Ilustração da comunidade">
        </section>

        <div id="map"></div>
        <script src="js/maps.js" defer></script>
        <script>
            fetch('/api/maps-key')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Não foi possível obter a chave do mapa');
                    }
                    return response.json();
                })
                .then(data => {
                    if (!data.key) {
                        throw new Error('Chave do Google Maps não configurada');
                    }

                    const script = document.createElement('script');
                    script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(data.key)}&callback=initMap&loading=async`;
                    script.async = true;
                    script.defer = true;
                    document.head.appendChild(script);
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById('map').textContent = 'Não foi possível carregar o mapa.';
                });
        </script>

        <section class="legenda">
            <div class="btn-vazamento-agua">
                <span class="icone vazamento-icone"><img src="/img/icone-vazamento.png" alt="Vazamento"></span>
                <span>Vazamento de Água</span>
            </div>
            <div class="legenda-falta-agua">
                <span class="icone falta-icone"><img src="/img/icone-falta-agua.png" alt="Falta de Água"></span>
                <span>Falta de Água</span>
            </div>
        </section>

        <nav class="bottom-nav" aria-label="Navegação principal">
            <a href="mapa.html" class="nav-item active">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4-7 4zM8 2v16M16 6v16"></path></svg>
                <span>Mapa</span>
            </a>

            <a href="registrar.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
                <span>Registrar</span>
            </a>
            <a href="./home.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Início</span>
            </a>
            <a href="historico.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                <span>Histórico</span>
            </a>
            <a href="comunidade.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                <span>Comunidade</span>
            </a>
        </nav>
        <script src="js/home.js"></script>
    </main>
</body>
</html>
