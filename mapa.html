<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Mapa de ocorrências de água">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/mapa.css">

    <title>Mapa</title>
</head>

<body>
    <main class="app">

        <header class="cabecalho">
            <a href="#" class="botao-voltar">←</a>
            <h1>MAPA</h1>
            <img src="img/perfil.png" alt="Foto do perfil" class="foto-perfil">
        </header>

        <section class="comunidade">
            <div class="comunidade-info">
                <h2>Sua Comunidade:</h2>
                <p>Rua Agupé - Alto Santa Terezinha, 131</p>
            </div>
            <img src="img/comunidade.png" alt="Ilustração da comunidade">
        </section>

        <section class="mapa">
            <img src="img/mapa.png" alt="Mapa da região">
            <span class="marcador falta-agua">🚰</span>
            <span class="marcador vazamento">💧</span>
        </section>

        <section class="legenda">
            <div class="legenda-item">
                <span class="icone vazamento-icone">💧</span>
                <span>Vazamento de Água</span>
            </div>
            <div class="legenda-item">
                <span class="icone falta-icone">🚰</span>
                <span>Falta de Água</span>
            </div>
        </section>

        <nav class="navegacao">
            <a href="mapa.html" class="navegacao-item ativo">
                <span>🗺️</span>
                <p>Mapa</p>
            </a>

            <a href="registrar.html" class="navegacao-item">
                <span>＋</span>
                <p>Registrar</p>
            </a>
            <a href="index.html" class="navegacao-item">
                <span>⌂</span>
                <p>Início</p>
            </a>
            <a href="historico.html" class="navegacao-item">
                <span>↶</span>
                <p>Histórico</p>
            </a>
            <a href="comunidade.html" class="navegacao-item">
                <span>👥</span>
                <p>Comunidade</p>
            </a>
        </nav>

    </main>

</body>
</html>
