<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOCAL — Registrar ocorrência</title>
  <link rel="stylesheet" href="css/registrar.css">
  <script src="js/registrar.js" defer></script>
</head>
<body>

  <div class="app">

    <header class="cabecalho">
      <button type="button" class="botao-voltar" id="botaoVoltar" aria-label="Voltar para a página anterior">
        <!-- Ícone de seta: caractere temporário, pode ser substituído por SVG/PNG na pasta img -->
        <span aria-hidden="true">&#8592;</span>
      </button>

      <h1 class="titulo-cabecalho">Registrar</h1>

      <div class="avatar-usuario">
        <img src="img/avatar-usuario.png" alt="Foto de perfil do usuário">
      </div>
    </header>

    <main class="conteudo-principal">

      <section class="secao-problema" aria-labelledby="tituloProblema">
        <h2 id="tituloProblema" class="titulo-problema">Qual o problema?</h2>
        <p class="subtitulo-problema">Escolha uma opção</p>

        <div class="lista-opcoes" role="group" aria-labelledby="tituloProblema">

          <button type="button" class="card-opcao" data-categoria="falta-de-agua" aria-label="Registrar ocorrência: Falta de água">
            <img class="icone-opcao" src="img/icone-falta-agua.png" alt="" aria-hidden="true">
            <span class="texto-opcao">Falta de água</span>
          </button>

          <button type="button" class="card-opcao" data-categoria="vazamento-de-agua" aria-label="Registrar ocorrência: Vazamento de água">
            <img class="icone-opcao" src="img/icone-vazamento.png" alt="" aria-hidden="true">
            <span class="texto-opcao">Vazamento de água</span>
          </button>

          <button type="button" class="card-opcao" data-categoria="esgoto-a-ceu-aberto" aria-label="Registrar ocorrência: Esgoto a céu aberto">
            <img class="icone-opcao" src="img/icone-esgoto.png" alt="" aria-hidden="true">
            <span class="texto-opcao">Esgoto a céu aberto</span>
          </button>

          <button type="button" class="card-opcao" data-categoria="lixo-acumulado" aria-label="Registrar ocorrência: Lixo acumulado">
            <img class="icone-opcao" src="img/icone-lixo.png" alt="" aria-hidden="true">
            <span class="texto-opcao">Lixo acumulado</span>
          </button>

          <button type="button" class="card-opcao" data-categoria="outros-problemas" aria-label="Registrar ocorrência: Outros problemas">
            <img class="icone-opcao" src="img/icone-outros.png" alt="" aria-hidden="true">
            <span class="texto-opcao">Outros problemas</span>
          </button>

        </div>
      </section>

    </main>

    <nav class="menu-inferior" aria-label="Navegação principal">
      <a href="mapa.html" class="item-menu">
        <span class="icone-menu" aria-hidden="true">🗺️</span>
        <span class="texto-menu">Mapa</span>
      </a>

      <a href="registrar.html" class="item-menu item-menu-ativo" aria-current="page">
        <span class="icone-menu" aria-hidden="true">➕</span>
        <span class="texto-menu">Registrar</span>
      </a>

      <a href="home.html" class="item-menu">
        <span class="icone-menu" aria-hidden="true">🏠</span>
        <span class="texto-menu">Início</span>
      </a>

      <!-- TODO: atualizar href quando historico.html for criado -->
      <a href="#" class="item-menu">
        <span class="icone-menu" aria-hidden="true">🕓</span>
        <span class="texto-menu">Histórico</span>
      </a>

      <!-- TODO: atualizar href quando comunidade.html for criado -->
      <a href="#" class="item-menu">
        <span class="icone-menu" aria-hidden="true">👥</span>
        <span class="texto-menu">Comunidade</span>
      </a>
    </nav>

  </div>

</body>
</html>
