<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <title>Mocau</title>

</head>
<body>
    
    <a href="index.html" class="botao-voltar">

        <i class="fa-solid fa-arrow-left"></i>
    </a>

    <header>

        <img src="/img/avatar-usuario.png" alt="Logo Mocau">

    </header>

    <h2 class="login">Login</h2>

    <main>

        <div class="formulário1">

        <p>
                <label for="email">Email</label>

            <div class="campo">
                <input 
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu email">
                
                
                <i class="fa-regular fa-envelope"></i>
            </div>  

        </p>

        <p>
                <label for="senha">Senha</label>

            <div class="campo">
                <input 
                    type="senha"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha">

                <i class="fa-regular fa-eye"></i>
            </div>
                
        </p>

        </div>    

         <div class="checkbox-wrapper-46">

                <input type="checkbox" id="cbx-46" class="inp-cbx" />

                <label for="cbx-46" class="cbx"

                    ><span>
                     <svg viewBox="0 0 12 10" height="10px" width="12px">
                        
                        <polyline points="1.5 6 4.5 9 10.5 1"></polyline></svg></span
                             ><span>Me lembre</span>
                </label>
        </div>

            <p class="senha">Esqueceu a senha?</p>

            <a class="entrar" href="/home.html">Entrar</a>

            <a class="cadastro" href="cadastro.html">Cadastre-se</a>
    </main>

</body>
</html>
