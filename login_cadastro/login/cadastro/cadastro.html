<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mocau</title>

    <link rel="stylesheet" href="cadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap%22 rel="stylesheet">
 

</head>
<body>

    <header>

        <h1>
            <img src="/Fotos/mocau.jpeg" alt="Logo Mocau">
        </h1>

        <h2>Cadastro</h2>

    </header>

    <main>
        <div class="formulário2">
 
            <p>
                <label for="nome">Nome</label>
 
                <input
 
                type="nome"
                id="nome"
                name="Nome">
               
            </p>
 
            <p>
                <label for="email">Email</label>
 
                <input type="email"
                id="email"
                name="email">
            </p>
        <div class="cep-bairro">
            <p>
                <label for="cep">Cep</label>
 
                <input type="cep"
                id="cep"
                name="cep">
            </p>

             <p>
                <label for="bairro">Bairro</label>
 
                <input type="bairro"
                id="bairro"
                name="bairro">
            </p>
        </div>    
             
             <p>
                <label for="senha">Senha</label>
 
                <input type="senha"
                id="senha"
                name="senha">
            </p>

             <p>
                <label for="confirmar_senha">Confirmação de senha</label>
 
                <input type="confirmar_senha"
                id="confirmar_senha"
                name="confirmar_senha">
            </p>

        </div>

        <div class="checkbox-wrapper-46">
 
                <input type="checkbox" id="cbx-46" class="inp-cbx" />
 
                <label for="cbx-46" class="cbx"
 
                    ><span>
                     <svg viewBox="0 0 12 10" height="10px" width="12px">
                       
                        <polyline points="1.5 6 4.5 9 10.5 1"></polyline></svg></span
                             ><span>Me lembre</span>
                </label>
        </div>

        <h2 class="cadastrar">Cadastrar</h2>
 
    </main>
    
</body>
</html>
