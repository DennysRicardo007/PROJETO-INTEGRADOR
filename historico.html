<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Histórico de ocorrências | MOCAU</title>

    <link rel="stylesheet" href="./css/historico.css">
    <link rel="stylesheet" href="./css/navbar.css">
</head>

<body>
    <main class="app-shell">

        <!-- CONTEÚDO PRINCIPAL -->
        <section class="page">

            <!-- CABEÇALHO -->
            <header class="page-header">
                <a href="home.html" class="back-button" aria-label="Voltar para o início">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19 12H5M11 6l-6 6 6 6"></path>
                    </svg>
                </a>

                <h1>Histórico de ocorrências</h1>

                <button class="avatar-button" type="button" aria-label="Abrir perfil">
                    <img
                        src="https://i.pravatar.cc/100"
                        alt="Foto do perfil"
                    >
                </button>
            </header>

            <!-- FILTRO + NOVA OCORRÊNCIA -->
            <section class="history-actions" aria-label="Ações do histórico">
                <button class="filter-button active" type="button" data-filter="todas">
                    Todas
                </button>

                <a href="registrar.html" class="new-occurrence-button">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 5v14M5 12h14"></path>
                    </svg>
                    <span>Gerar nova ocorrência</span>
                </a>
            </section>

            <!-- LISTA DE OCORRÊNCIAS -->
            <section
                id="occurrences-list"
                class="occurrences-list"
                aria-label="Lista de ocorrências"
            >
                <!-- Os cards são inseridos pelo JavaScript -->
            </section>

            <!-- ESTADO VAZIO -->
            <div id="empty-state" class="empty-state" hidden>
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M7 3h10v18H7z"></path>
                        <path d="M9 7h6M9 11h6M9 15h4"></path>
                    </svg>
                </div>

                <h2>Nenhuma ocorrência encontrada</h2>
                <p>As ocorrências registradas aparecerão aqui.</p>
            </div>

        </section>

        <!-- NAVEGAÇÃO INFERIOR -->
        <nav class="bottom-nav" aria-label="Navegação principal">

            <a href="mapa.html" class="nav-item">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4-7 4zM8 2v16M16 6v16"></path>
                </svg>
                <span>Mapa</span>
            </a>

            <a href="registrar.html" class="nav-item">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 5v14M5 12h14"></path>
                </svg>
                <span>Registrar</span>
            </a>

            <a href="home.html" class="nav-item">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Início</span>
            </a>

            <a href="historico.html" class="nav-item active" aria-current="page">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>Histórico</span>
            </a>

            <a href="comunidade.html" class="nav-item">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span>Comunidade</span>
            </a>

        </nav>
    </main>

    <script src="./js/historico.js"></script>
</body>
</html>
