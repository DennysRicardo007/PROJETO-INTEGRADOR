<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mocau</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?famils:y=Poppinital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap%22 rel="stylesheet">
 

</head>
<body>

    <a href="login.html" class="botao-voltar">

        <i class="fa-solid fa-arrow-left"></i>
    </a>

    <header>

        <h1>
            <img src="/img/avatar-usuario.png" alt="Logo Mocau">
        </h1>

        <h2>Cadastro</h2>
        <p id="mensagem-cadastro"></p>

    </header>

    <main>
        <div class="formulário2">
 
            <p>
                <label for="nome">Nome</label>
                
                <div class="campo"> 
                    <input
                        type="nome"
                        id="nome"
                        name="Nome"
                        placeholder="Digite seu nome">

                    <i class="fa-regular fa-user"></i>
                </div>
                
                
            </p>
 
            <p>
                <label for="email">Email</label>
                
                <div class="campo">
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu email">

                    <i class="fa-regular fa-envelope"></i>
                </div>
        
            </p>

        <div class="cep-bairro">

            <p>
                <label for="cep">Cep</label>
                
        <div class="campo">

                    <input 
                        type="cep"
                        id="cep"
                        name="cep"
                        placeholder="Digite seu cep">
                
                <i class="fa-solid fa-location-dot"></i>

        </div>
                
            </p>

             <p>
                <label for="bairro">Bairro</label>
                
        <div class="campo">

                <input 
                    type="bairro"
                    id="bairro"
                    name="bairro"
                    placeholder="Digite seu bairro">

                <i class="fa-solid fa-home"></i>
        </div>     
               
            </p>
        </div>    
             
             <p>
                <label for="senha">Senha</label>
 
                <div class="campo">
                    <input 
                    type="senha"
                    id="senha"
                    name="senha"
                    placeholder="Digite uma senha">
                
                <i class="fa-regular fa-eye"></i>
                </div>
                
            </p>

             <p>
                <label for="confirmar_senha">Confirmação de senha</label>
 
                <div class="campo">
                    <input 
                    type="senha"
                    id="senha"
                    name="senha"
                    placeholder="Digite uma senha">
                
                <i class="fa-regular fa-eye"></i>
                </div>
            </p>

        </div>

        <div class="checkbox-wrapper-46">
 
                <input type="checkbox" id="cbx-46" class="inp-cbx" />
 
                <label for="cbx-46" class="cbx"
 
                    ><span>
                     <svg viewBox="0 0 12 10" height="10px" width="12px">
                       
                        <polyline points="1.5 6 4.5 9 10.5 1"></polyline></svg></span
                             ><span>Me lembre</span>
                </label>
        </div>

        <div class="cadastro-completo">
            <a href="login.html" id="btn-cadastrar">Cadastrar</a>
        </div>


    </main>
    
    <script src="script.js"></script>
    
</body>
</html>
