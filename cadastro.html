<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mocau</title>

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #f4f6f9 100%);
      min-height: 100vh;
    }

    /* Container com proporção de App Mobile */
    .cadastro-card {
      width: 100%;
      max-width: 440px;
      border: none;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      background-color: #ffffff;
      position: relative;
    }

    .btn-voltar {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0D6EFD;
      background-color: transparent;
      transition: background-color 0.2s;
    }

    .btn-voltar:hover {
      background-color: #f2f2f2;
    }

    .btn-voltar svg {
      width: 27px;
      height: 27px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .logo-img {
      max-width: 110px;
      height: auto;
    }

    /* Estilização dos Inputs com Ícones */
    .input-group-text {
      background-color: #f8f9fa;
      border-left: none;
      color: #6c757d;
      cursor: pointer;
    }

    .form-control {
      border-right: none;
      padding: 10px 14px;
      background-color: #f8f9fa;
      font-size: 0.9rem;
    }

    .form-control:focus {
      background-color: #fff;
      box-shadow: none;
      border-color: #dee2e6;
    }

    .form-control:focus + .input-group-text {
      background-color: #fff;
      border-color: #dee2e6;
    }

    .btn-primary-custom {
      border-radius: 12px;
      padding: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-primary-custom:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

  <div class="card cadastro-card p-4 p-sm-4">
    
    <!-- BOTÃO VOLTAR -->
    <a href="login.html" class="btn-voltar text-decoration-none" aria-label="Voltar para o login">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 12H5M11 6l-6 6 6 6"></path>
      </svg>
    </a>

    <!-- CABEÇALHO -->
    <div class="text-center mt-2 mb-3">
      <img src="/img/logo_MOCAL.png" alt="Logo Mocau" class="logo-img mb-2">
      <h2 class="h4 fw-bold text-dark mb-1">Crie sua Conta</h2>
      <p id="mensagem-cadastro" class="text-muted small mb-0"></p>
    </div>

    <!-- FORMULÁRIO -->
    <form action="login.html" method="POST">
      
      <!-- CAMPO NOME -->
      <div class="mb-2">
        <label for="nome" class="form-label small fw-medium text-secondary mb-1">Nome</label>
        <div class="input-group">
          <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite seu nome" required>
          <span class="input-group-text">
            <i class="fa-regular fa-user"></i>
          </span>
        </div>
      </div>

      <!-- CAMPO EMAIL -->
      <div class="mb-2">
        <label for="email" class="form-label small fw-medium text-secondary mb-1">Email</label>
        <div class="input-group">
          <input type="email" class="form-control" id="email" name="email" placeholder="Digite seu email" required>
          <span class="input-group-text">
            <i class="fa-regular fa-envelope"></i>
          </span>
        </div>
      </div>

      <!-- CEP E BAIRRO EM 2 COLUNAS -->
      <div class="row g-2 mb-2">
        <div class="col-6">
          <label for="cep" class="form-label small fw-medium text-secondary mb-1">CEP</label>
          <div class="input-group">
            <input type="text" class="form-control" id="cep" name="cep" placeholder="00000-000">
            <span class="input-group-text">
              <i class="fa-solid fa-location-dot"></i>
            </span>
          </div>
        </div>

        <div class="col-6">
          <label for="bairro" class="form-label small fw-medium text-secondary mb-1">Bairro</label>
          <div class="input-group">
            <input type="text" class="form-control" id="bairro" name="bairro" placeholder="Seu bairro">
            <span class="input-group-text">
              <i class="fa-solid fa-house"></i>
            </span>
          </div>
        </div>
      </div>

      <!-- CAMPO SENHA -->
      <div class="mb-2">
        <label for="senha" class="form-label small fw-medium text-secondary mb-1">Senha</label>
        <div class="input-group">
          <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite uma senha" required>
          <span class="input-group-text">
            <i class="fa-regular fa-eye"></i>
          </span>
        </div>
      </div>

      <!-- CAMPO CONFIRMAÇÃO DE SENHA -->
      <div class="mb-3">
        <label for="confirmar_senha" class="form-label small fw-medium text-secondary mb-1">Confirmação de senha</label>
        <div class="input-group">
          <input type="password" class="form-control" id="confirmar_senha" name="confirmar_senha" placeholder="Confirme sua senha" required>
          <span class="input-group-text">
            <i class="fa-regular fa-eye"></i>
          </span>
        </div>
      </div>

      <!-- CHECKBOX TERMOS/LEMBRAR -->
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="lembreme">
        <label class="form-check-label small text-muted" for="lembreme">
          concordo com os <a href="#" class="text-decoration-none text-primary fw-bold">termos de uso</a> e a <a href="#" class="text-decoration-none text-primary fw-bold">política de privacidade</a>
        </label>
      </div>

      <!-- BOTÃO DE SUBMIT -->
      <div class="d-grid mb-3">
        <button type="submit" id="btn-cadastrar" class="btn btn-primary btn-primary-custom shadow-sm">
          Cadastrar
        </button>
      </div>

      <!-- LINK PARA LOGIN -->
      <div class="text-center">
        <span class="small text-muted">Já tem uma conta?</span>
        <a href="login.html" class="small text-primary text-decoration-none fw-bold ms-1">Faça login</a>
      </div>

    </form>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
